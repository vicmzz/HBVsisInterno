}

.show {

.hidden {

function showScreen(id){

if (["start","loading","connecting","terminal","pre","result","final","notfound"].includes(id)) {
    bgSound.play().catch(()=>{});
}

  screens.forEach(s => {
    const el = document.getElementById(s);
    el.classList.add("hidden");
    el.classList.remove("show");
  });

  const target = document.getElementById(id);
  target.classList.remove("hidden");

  setTimeout(() => {
    target.classList.add("show");
  }, 50);

  if (["loading","connecting","pre"].includes(id)) {
    beepSound.currentTime = 0;
    beepSound.play().catch(()=>{});
  }

  if (id === "loading") {
    signalSound.play().catch(()=>{});
  }

  if (id !== "loading" && id !== "connecting") {
    signalSound.pause();
    signalSound.currentTime = 0;
  }

  if (id === "pre") {
    preSound.play().catch(()=>{});
  } else {
    preSound.pause();
    preSound.currentTime = 0;
  }

if (["hbv1","hbv2","hbv3","hbv4"].includes(id)) {
  hbvSound.play().catch(()=>{});
} else {
  hbvSound.pause();
  hbvSound.currentTime = 0;
}

if (id === "final") {
  errorSound.pause();
  errorSound.currentTime = 0;
}
}

function showLinesSequentially(element, text) {
  const lines = text.split("\n");
  element.innerText = "";
  element.style.display = "flex";
  element.style.flexDirection = "column";
  element.style.gap = "10px"; // Espaço fixo entre as linhas

  lines.forEach((lineText, index) => {
    const lineDiv = document.createElement("div");
    lineDiv.innerText = lineText;
    lineDiv.style.opacity = "0"; // Começa invisível
    lineDiv.style.transition = "opacity 0.5s"; // Efeito de aparecer suave
    lineDiv.style.height = "1.6em"; // Reserva o espaço da linha
    element.appendChild(lineDiv);

    // Revela a linha sem mover as outras
    setTimeout(() => {
      lineDiv.style.opacity = "1";
    }, index * 2000);
  });
}

  return;
}
      

      setTimeout(() => {
        text.style.transition = "opacity 1s";
        text.style.opacity = "0";
      }, 7000);

      setTimeout(() => {
        text.remove();
        showScreen("final");

        setTimeout(() => {
          showScreen("terminal");
          document.getElementById("inputBox").classList.remove("hidden");
        }, 4000);

      }, 8000);

    }, 4000);
  }
});
</script>
